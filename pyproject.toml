[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-analyser-145"
version = "0.1.0"
description = "A read-only disk usage analyser for Coding Challenge #145"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
disk-analyser = "diskanalyser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
